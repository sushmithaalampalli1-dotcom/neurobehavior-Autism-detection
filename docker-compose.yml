version: '3.8'

services:
  neurobehavior-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurobehavior-asd-portal
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-change-in-production
      - PORT=5000
    volumes:
      - app-uploads:/app/uploads
      - app-reports:/app/reports
    restart: unless-stopped

volumes:
  app-uploads:
  app-reports:
